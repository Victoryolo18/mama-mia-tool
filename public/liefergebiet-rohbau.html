<title>Liefergebiet Oberhavel</title>
<style>
  :root {
    --grund: #FAF7F2;
    --karte: #FFFFFF;
    --tinte: #1C1008;
    --leise: #6E5847;
    --linie: #E7DCC9;
    --gold: #A8862F;
    --gold-tief: #6E5316;
    --gold-flaeche: rgba(201,168,76,.20);
    --kastanie: #5C2818;
    --kastanie-flaeche: rgba(92,40,24,.06);
    --land: #EFE7D7;
    --land-berlin: #E7DCC6;
    --land-hover: #E6DAC3;
    --landlinie: #D5C7AE;
    --schatten: 0 1px 2px rgba(28,16,8,.05), 0 8px 24px rgba(28,16,8,.07);
    --display: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --zahl: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  /* Bewusst nur ein Farbschema: Die Seite sitzt eingebettet in
     mama-mia-events.de, und die Website ist durchgehend hell (#FAF7F2).
     Wuerde sich die Karte nach der Einstellung des Besuchers richten,
     erschiene sie bei jedem mit Dunkelmodus als dunkelbrauner Block
     mitten in einer hellen Seite. Alle Farben stehen deshalb fest. */

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--grund);
    color: var(--tinte);
    font-family: var(--text);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .huelle {
    max-width: 760px;
    margin: 0 auto;
    padding: 8px 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .kopf { display: flex; flex-direction: column; gap: 10px; }
  .kopf h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(28px, 5vw, 40px);
    line-height: 1.15;
    letter-spacing: -.01em;
    margin: 0;
    text-wrap: balance;
  }
  .kopf p { margin: 0; color: var(--leise); max-width: 56ch; }

  .suche { display: flex; flex-direction: column; gap: 0; position: relative; }
  .suche label {
    font-size: 12px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--leise);
    margin-bottom: 8px;
  }
  .suche input {
    width: 100%;
    font: inherit;
    font-size: 18px;
    padding: 15px 17px;
    color: var(--tinte);
    background: var(--karte);
    border: 1px solid var(--linie);
    border-radius: 4px;
    box-shadow: var(--schatten);
  }
  .suche input::placeholder { color: var(--leise); opacity: .8; }
  .suche input:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
    border-color: var(--gold);
  }

  .treffer { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
  .treffer li { margin: 0; }
  .treffer button {
    width: 100%;
    display: flex;
    align-items: baseline;
    gap: 12px;
    text-align: left;
    font: inherit;
    color: var(--tinte);
    background: var(--karte);
    border: 1px solid var(--linie);
    border-radius: 3px;
    padding: 12px 15px;
    cursor: pointer;
  }
  .treffer button:hover { border-color: var(--gold); }
  .treffer button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .treffer .name { font-weight: 600; }
  .treffer .plz { color: var(--leise); font-family: var(--zahl); font-size: 13px; }
  .treffer .zeit { margin-left: auto; color: var(--leise); font-family: var(--zahl); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .antwort {
    border: 1px solid var(--linie);
    border-left: 3px solid var(--gold);
    background: var(--karte);
    border-radius: 4px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    box-shadow: var(--schatten);
  }
  .antwort.frage { border-left-color: var(--kastanie); }
  .antwort .zeile1 { font-family: var(--display); font-size: 21px; line-height: 1.25; }
  .antwort .zeile2 { color: var(--leise); font-size: 15px; }
  .antwort .zeile2 b { color: var(--tinte); font-weight: 600; font-variant-numeric: tabular-nums; }
  .antwort a { color: var(--gold); font-weight: 600; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .antwort.frage a { color: var(--kastanie); }

  .kartenfeld {
    background: var(--karte);
    border: 1px solid var(--linie);
    border-radius: 4px;
    padding: 8px 8px 0;
    box-shadow: var(--schatten);
    overflow: hidden;
  }
  .kartenfeld svg { display: block; width: 100%; height: auto; }
  .kreis { transition: fill .15s ease; }
  .kreis:hover { fill: var(--land-hover); }
  @media (prefers-reduced-motion: reduce) { .kreis { transition: none; } }

  .legende {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 22px;
    padding: 14px 12px 16px;
    border-top: 1px solid var(--linie);
    margin-top: 8px;
    font-size: 14px;
    color: var(--leise);
  }
  .legende span { display: inline-flex; align-items: center; gap: 8px; }
  .punkt { width: 13px; height: 13px; border-radius: 3px; flex: none; }
  .punkt.gold { background: var(--gold-flaeche); border: 1.5px solid var(--gold); }
  .punkt.kastanie { background: var(--kastanie-flaeche); border: 1.5px dashed var(--kastanie); }

  .fussnote { font-size: 13px; color: var(--leise); margin: 0; }
  .fussnote a { color: inherit; }

  @media (prefers-reduced-motion: no-preference) {
    .pulsiert { animation: pulsieren 1.6s ease-out 2; transform-origin: center; transform-box: fill-box; }
    @keyframes pulsieren { 0%,100% { r: 2.4; } 50% { r: 5; } }
  }
</style>

  svg.setAttribute("viewBox", "0 0 " + PROJ.W + " " + PROJ.H);

  function el(name, attrs) {
    const n = document.createElementNS(NS, name);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  /* Gleiche Projektion fuer Umrisse und Orte, sonst passt nichts aufeinander. */
  const legen = (lat, lon) => ({
    x: lon * PROJ.cos * PROJ.skala + PROJ.vx,
    y: -lat * PROJ.skala + PROJ.vy
  });

  const landGruppe = el("g", {});
  svg.appendChild(landGruppe);
  KREISE.forEach(([name, istBerlin, d]) => {
    const flaeche = el("path", {
      d, fill: istBerlin ? "var(--land-berlin)" : "var(--land)",
      stroke: "var(--landlinie)", "stroke-width": .5, "stroke-linejoin": "round"
    });
    flaeche.setAttribute("class", "kreis");
    const titel = el("title", {});
    titel.textContent = name.replace(/ Städte$/, "").replace("Frankfurt am Oder", "Frankfurt (Oder)");
    flaeche.appendChild(titel);
    landGruppe.appendChild(flaeche);
  });

  const roh = [];
  for (const plz in ANKER) {
    const [name, lat, lon, gross] = ANKER[plz];
    roh.push(Object.assign({ plz, name, gross }, legen(lat, lon)));
  }

  function huelle(punkte) {
    const p = [...punkte].sort((a, b) => a.x - b.x || a.y - b.y);
    const kreuz = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
    const bauen = liste => {
      const s = [];
      for (const q of liste) {
        while (s.length >= 2 && kreuz(s[s.length - 2], s[s.length - 1], q) <= 0) s.pop();
        s.push(q);
      }
      s.pop();
      return s;
    };
    return bauen(p).concat(bauen([...p].reverse()));
  }

  function aufblasen(punkte, abstand) {
    const mx = punkte.reduce((s, p) => s + p.x, 0) / punkte.length;
    const my = punkte.reduce((s, p) => s + p.y, 0) / punkte.length;
    return punkte.map(p => {
      const dx = p.x - mx, dy = p.y - my, l = Math.hypot(dx, dy) || 1;
      return { x: p.x + dx / l * abstand, y: p.y + dy / l * abstand };
    });
  }

  /* Weiche Kontur: quadratische Kurven durch die Kantenmitten. */
  function kontur(punkte) {
    const m = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    let d = "";
    const start = m(punkte[punkte.length - 1], punkte[0]);
    d += `M ${start.x.toFixed(1)} ${start.y.toFixed(1)}`;
    for (let i = 0; i < punkte.length; i++) {
      const p = punkte[i], next = punkte[(i + 1) % punkte.length], mid = m(p, next);
      d += ` Q ${p.x.toFixed(1)} ${p.y.toFixed(1)} ${mid.x.toFixed(1)} ${mid.y.toFixed(1)}`;
    }
    return d + " Z";
  }

  const rand = huelle(roh);
  svg.appendChild(el("path", {

  (() => {

    const y0 = Math.min(...ys) - luft, y1 = Math.max(...ys) + luft;

  })();

    const q = falten(text);

    const beginnt = [], enthaelt = [];
    for (const o of ORTE) {

      if (n.startsWith(q) || o[1].startsWith(q)) beginnt.push(o);
